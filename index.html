<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>顏料庫存</title>
  <meta name="description" content="模型顏料庫存管理：查色碼、避免重複購買、記錄每個計畫的塗裝分層。">
  <meta name="theme-color" content="#1e2a29">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="顏料庫存">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var t = localStorage.getItem('pi-theme') || 'dark';
      if (t === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="overlays"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript>這個系統需要開啟 JavaScript 才能使用。</noscript>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
